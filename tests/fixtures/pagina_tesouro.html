<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Rendimento dos Títulos - Tesouro Direto (cópia de teste)</title>
  <link rel="stylesheet" href="/estilo-que-nao-existe.css">
</head>
<body>
  <h1>Rendimento dos títulos</h1>
  <img src="/banner-que-nao-existe.png" alt="">
  <table id="titulos"><tbody></tbody></table>
  <script>
    // Igual ao site real: a tabela é preenchida por um fetch depois que a página carrega.
    setTimeout(async () => {
      const r = await fetch("/o/rentabilidade/investir");
      const dados = await r.json();
      const corpo = document.querySelector("#titulos tbody");
      for (const item of dados.TesouroLegado) {
        const tr = document.createElement("tr");
        tr.textContent = item.treasuryBondName;
        corpo.appendChild(tr);
      }
    }, 50);
  </script>
</body>
</html>
