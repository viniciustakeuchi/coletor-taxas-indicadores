name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Chromium do Playwright
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tipagem
        run: mypy coletor tests
      - name: Testes (SQLite, sem internet)
        run: pytest --cov=coletor --cov-report=term-missing --cov-fail-under=90

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coletor
          POSTGRES_PASSWORD: coletor
          POSTGRES_DB: coletor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coletor"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://coletor:coletor@localhost:5432/coletor
      TEST_DATABASE_URL: postgresql+asyncpg://coletor:coletor@localhost:5432/coletor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrações sobem, descem e batem com os modelos
        run: |
          alembic upgrade head && alembic downgrade base && alembic upgrade head
          alembic check
      - name: Testes de carga e coleta no Postgres
        run: pytest tests/test_carga.py tests/test_coleta.py tests/test_metricas.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t coletor-taxas-indicadores .
      - name: Imagem tem o Chromium e roda como usuário comum
        run: |
          docker run --rm coletor-taxas-indicadores whoami | grep -x coletor
          docker run --rm coletor-taxas-indicadores coletor --help
