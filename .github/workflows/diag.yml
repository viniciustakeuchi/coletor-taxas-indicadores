name: diag
on:
  push:
    branches: [diagnostico]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python diag.py
      - run: |
          for u in o/rentabilidade/investir o/rentabilidade/resgatar; do
            echo "== curl $u"; curl -sS -m 30 -w "\nHTTP %{http_code}\n" -A "Mozilla/5.0" "https://www.tesourodireto.com.br/$u" | head -c 600; echo
          done
