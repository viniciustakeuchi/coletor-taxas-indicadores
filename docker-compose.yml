services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coletor
      POSTGRES_PASSWORD: coletor
      POSTGRES_DB: coletor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coletor"]
      interval: 2s
      timeout: 3s
      retries: 15

  coletor:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://coletor:coletor@db:5432/coletor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
